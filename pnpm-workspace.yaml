packages:
  - "apps/*"
  - "packages/*"

# Supply chain security
minimumReleaseAge: 1440
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
verifyDepsBeforeRun: install
autoInstallPeers: true

overrides:
  chokidar: ^5.0.0

allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  workerd: true

catalog:
  svelte: ^5.57.0
  '@sveltejs/kit': ^2.70.3
  '@sveltejs/vite-plugin-svelte': ^7.3.0
  '@sveltejs/adapter-static': ^3.0.10
  vite: ^8.3.0
  svelte-check: ^4.7.6
  # typescript resolves to the TS 6 API package so typescript-eslint and
  # svelte-check keep working; the native TS 7 tsc comes from the
  # @typescript/native alias below.
  typescript: npm:@typescript/typescript6@6.0.2
  '@typescript/native': npm:typescript@7.0.2
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  '@tailwindcss/typography': ^0.5.20
  tailwind-merge: ^3.6.0
  tailwind-variants: ^3.3.1
  eslint: ^10.10.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-svelte: ^3.23.0
  typescript-eslint: ^8.70.0
  prettier: ^3.9.6
  prettier-plugin-svelte: ^4.1.1
  globals: ^17.12.0
  '@tiptap/core': ^3.31.3
  '@tiptap/extension-character-count': ^3.31.3
  '@tiptap/extension-code-block-lowlight': ^3.31.3
  '@tiptap/extension-document': ^3.31.3
  '@tiptap/extension-file-handler': ^3.31.3
  '@tiptap/extension-image': ^3.31.3
  '@tiptap/extension-mathematics': ^3.31.3
  '@tiptap/extension-task-item': ^3.31.3
  '@tiptap/extension-task-list': ^3.31.3
  '@tiptap/extension-typography': ^3.31.3
  '@tiptap/pm': ^3.31.3
  '@tiptap/starter-kit': ^3.31.3
  katex: 0.18.7
  mermaid: ^11.17.2
  lowlight: ^3.3.0
  d3-force: ^3.0.0
  d3-quadtree: ^3.0.1
  '@types/d3-force': ^3.0.10
  '@types/d3-quadtree': ^3.0.6
  tiptap-markdown: ^0.9.0
  bits-ui: ^2.19.2
  "@lucide/svelte": ~1.43.0
  clsx: ^2.1.1
  '@internationalized/date': ^3.12.4
  mode-watcher: ^1.1.0
  '@electric-sql/pglite': ^0.5.8
  '@noble/ed25519': ^3.2.0
  markdown-it: ^15.0.1
  '@tauri-apps/api': ^2.11.1
  '@tauri-apps/cli': ^2.11.4
  '@tauri-apps/plugin-fs': ^2.5.2
  '@tauri-apps/plugin-os': ^2.3.2
  '@tauri-apps/plugin-dialog': ^2.7.3
  '@tauri-apps/plugin-shell': ^2.3.6
  '@types/node': ^26.5.1
