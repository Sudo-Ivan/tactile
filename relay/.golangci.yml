version: '2'

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - usestdlibvars
  settings:
    gosec:
      excludes: []
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false
  exclusions:
    generated: lax
    rules:
      # Tests are allowed looser error handling and longer functions.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - revive

formatters:
  enable:
    - gofmt
    - gofumpt
