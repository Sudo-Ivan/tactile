name: pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/homepage/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions: {}

env:
  # Project-pages layout: https://<user>.github.io/tactile for the
  # homepage and /tactile/app for the web app. For a custom domain set
  # PUBLIC_SITE_URL to the domain and PUBLIC_BASE_PATH to ''.
  PUBLIC_SITE_URL: https://sudo-ivan.github.io/tactile
  PUBLIC_BASE_PATH: /tactile
  PUBLIC_APP_URL: https://sudo-ivan.github.io/tactile/app

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build homepage
        run: pnpm --filter homepage build

      - name: Build web app under /app
        run: pnpm --filter web build
        env:
          PUBLIC_BASE_PATH: ${{ env.PUBLIC_BASE_PATH }}/app

      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp -r apps/homepage/build/* _site/
          cp -r apps/web/build/* _site/app/

      - name: Setup pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
